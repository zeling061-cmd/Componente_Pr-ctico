<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promedio de Notas</title>
</head>
<body>
    <h2>Resultados del Promedio de Notas</h2>

    <script>
        let N = Number(prompt("Ingrese el número de notas a calcular"));
        let contador = 1;
        let nota = 0;
        let nota_alta = -Infinity;
        let nota_baja = Infinity;
        let sum_general = 0;
        let sum_aprobados = 0;
        let sum_reprobados = 0;
        let contador_aprobados = 0;
        let contador_reprobados = 0;

        if (N > 0) {
            while (contador <= N) { //Bucle para ingresar las notas
                nota = Number(prompt("Ingrese la nota" + contador));
                contador = contador + 1;

                if (nota > nota_alta) {
                    nota_alta = nota;
                }
                if (nota < nota_baja) {
                    nota_baja = nota;
                }

                sum_general = sum_general + nota;

                if (nota >= 14) {
                    sum_aprobados = sum_aprobados + nota;
                    contador_aprobados = contador_aprobados + 1;
                } else {
                    sum_reprobados = sum_reprobados + nota;
                    contador_reprobados = contador_reprobados + 1;
                }
            }

            let prom_general = sum_general / N;
            let prom_aprobados = contador_aprobados > 0 ? sum_aprobados / contador_aprobados : 0;
            let prom_reprobados = contador_reprobados > 0 ? sum_reprobados / contador_reprobados : 0;
            let porcentajes_aprobados = (contador_aprobados * 100) / N;

            document.write("Promedio General: " + prom_general.toFixed(2) + "<br>");
            document.write("Promedio Aprobados: " + prom_aprobados.toFixed(2) + "<br>");
            document.write("Promedio Reprobados: " + prom_reprobados.toFixed(2) + "<br>");
            document.write("Nota Alta: " + nota_alta + "<br>");
            document.write("Nota Baja: " + nota_baja + "<br>");
            document.write("Porcentaje de Aprobados: " + porcentajes_aprobados.toFixed(2) + "%<br>");

            if (porcentajes_aprobados > 70) {
                document.write("<strong>Resultado: Excelente Rendimiento</strong>");
            } else {
                document.write("<strong>Resultado: Debe Mejorar</strong>");
            }
        } else {
            document.write("Debe ingresar un número de notas mayor a 0.");
        }
    </script>
</body>
</html>
