<!DOCTYPE html>
<html>
<head>
    <title>Clasificacion y Suma de Numeros</title>
</head>
<body>

    <h2>Clasificacion y Suma de Numeros</h2>

    <!-- Ingreso de la cantidad de numeros -->
    <label>Ingrese la cantidad de numeros:</label>
    <input type="number" id="cantidad" min="1">

    <br><br>

    <button onclick="generar()">Ingresar Numeros</button>

    <!-- Espacio para ingresar los numeros -->
    <div id="numeros"></div>

    <br>

    <button onclick="calcular()">Calcular Resultados</button>

    <p id="resultado"></p>

<script>

// Algoritmo para clasificar y sumar numeros

// Generar los espacios para ingresar los numeros
function generar() {

    let N = Number(document.getElementById("cantidad").value);
    let contador = 1;

    if (!Number.isInteger(N) || N <= 0)
    {
        document.getElementById("numeros").innerHTML =
        "Ingrese una cantidad mayor que cero.";
        return;
    }

    let contenido = "";

    // Crear los espacios de ingreso
    while (contador <= N)
    {
        contenido = contenido +
        "Numero " + contador + ": " +
        '<input type="number" id="num' + contador + '"><br><br>';

        contador++;
    }

    document.getElementById("numeros").innerHTML = contenido;

    document.getElementById("resultado").innerHTML = "";

}

// Calcular los resultados
function calcular() {

    let N = Number(document.getElementById("cantidad").value);

    // Definir las variables
    let contador = 1, num = 0;
    let sumaPositivos = 0, sumaNegativos = 0;
    let multiplos = 0, positivos = 0, negativos = 0;

    // Recorrer los numeros ingresados
    while (contador <= N)
    {
        let dato = document.getElementById("num" + contador).value;

        if (dato == "" || !Number.isInteger(Number(dato)))
        {
            document.getElementById("resultado").innerHTML =
            "Complete todos los numeros con valores enteros.";
            return;
        }

        num = Number(dato);

        // Comprobar si es positivo
        if (num > 0)
        {
            positivos++;

            // Comprobar si es par
            if (num % 2 == 0)
            {
                sumaPositivos = sumaPositivos + num;
            }
        }
        else
        {
            // Comprobar si es negativo
            if (num < 0)
            {
                negativos++;

                // Comprobar si es impar
                if (num % 2 != 0)
                {
                    sumaNegativos = sumaNegativos + num;
                }
            }
        }

        // Contar multiplos de 3 o 5
        if (num % 3 == 0 || num % 5 == 0)
        {
            multiplos++;
        }

        contador++;
    }

    // Comparar positivos y negativos
    let comparacion = "";

    if (positivos > negativos)
    {
        comparacion = "Positivos > Negativos";
    }
    else if (positivos < negativos)
    {
        comparacion = "Positivos < Negativos";
    }
    else
    {
        comparacion = "Positivos = Negativos";
    }

    // Mostrar los resultados
    document.getElementById("resultado").innerHTML =
    "Suma positivos pares = " + sumaPositivos +
    "<br>Suma negativos impares = " + sumaNegativos +
    "<br>Multiplos de 3 o 5 = " + multiplos +
    "<br>Total de positivos = " + positivos +
    "<br>Total de negativos = " + negativos +
    "<br>Comparacion: " + comparacion;

}

</script>

</body>
</html>
